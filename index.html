<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحديقة المزدهرة</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<style>
:root{--top:#cdeefb;--bg:#eaf7e1;--card:#fffaf0;--opt:#fff;--ink:#25402f;--leaf:#3f9b4f;--deep:#1f5d3a;--line:#e3d9bd;--bad:#e9a23b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--top:#1b3b4d;--bg:#14281c;--card:#1f3a2a;--opt:#274a33;--ink:#f2f0e2;--line:#35563f;--deep:#9bdc9f}}
:root[data-theme="dark"]{--top:#1b3b4d;--bg:#14281c;--card:#1f3a2a;--opt:#274a33;--ink:#f2f0e2;--line:#35563f;--deep:#9bdc9f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--top),var(--bg) 320px) var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;font-size:1.1rem}
.wrap{max-width:1000px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.c{text-align:center}
h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;margin:.1em 0;color:var(--deep);text-shadow:0 3px 0 rgba(255,255,255,.7)}
h2{margin:.3em 0}.sub{font-size:1.5rem;margin:0 0 12px}
.garden{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 26px rgba(31,93,58,.28);background:#9bd27f}
.garden img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;transform:scale(1.17);transform-origin:50% 100%;transition:opacity 2s}
.deco span{position:absolute;font-size:clamp(18px,3.4vw,30px);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,226,120,.38),transparent 60%)}
.pop{animation:pop .8s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(0);opacity:0}}
.btn{font:inherit;font-weight:800;font-size:1.35rem;background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:12px 38px;box-shadow:0 5px 0 var(--deep);cursor:pointer;margin:14px 0}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
.ghost{font:inherit;background:none;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 16px;cursor:pointer}
button:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
.hb{font-size:1.4rem;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;vertical-align:middle}
.top{flex-wrap:wrap;gap:6px;display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-size:1.25rem}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6fcf6f,#3f9b4f);transition:width .5s}
.play{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.play{grid-template-columns:1fr}}
.ins{font-weight:700;font-size:1.3rem;margin:4px 0 8px}
.verse{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:2;background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:8px 16px;text-align:center;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font-family:Amiri,serif;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:700;min-height:66px;background:var(--opt);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:8px 12px;cursor:pointer;text-align:center;transition:transform .15s}
.opt:not(:disabled):hover{transform:scale(1.03);border-color:var(--leaf)}
.opt:disabled{cursor:default}.opt.ok{background:#dff5dc;border-color:#3fa55a;color:#1d4d2b}.opt.ok::after{content:" ✓";color:#2e9a4c}
.opt.no{background:#fff0d6;border-color:var(--bad);color:#6b4a10}
.card{display:block;width:100%;font-size:clamp(1.1rem,2.2vw,1.4rem);line-height:1.8;margin-bottom:8px}.card small{display:inline-block;background:var(--leaf);color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;margin-left:8px;font-family:inherit}
.hint{padding:14px;border:2px dashed var(--line);border-radius:14px;margin-bottom:8px}
.fb{font-weight:800;font-size:1.3rem;margin-top:10px}.fb.g{color:#2e9a4c}.fb.a{color:#b9770e}
.lvs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
@media(max-width:700px){.lvs{grid-template-columns:repeat(2,1fr)}}
.lv{font:inherit;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 6px;cursor:pointer;color:var(--ink)}
.lv b{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--leaf);color:#fff;font-size:1.7rem}
.lv:disabled{opacity:.6;border-style:dashed;filter:grayscale(1);cursor:not-allowed}.lv:disabled b{background:#9aa69c}.lv.d{border-color:var(--leaf)}
.gate{position:relative;height:270px;border-radius:20px;overflow:hidden;perspective:900px;margin:12px 0;border:4px solid #7a4a1a}
.secret{position:absolute;inset:0;display:grid;place-content:center;gap:4px;background:radial-gradient(circle,#fff6b8,#a6e6a0 55%,#3f9b4f);color:#1f5d3a;font-size:1.5rem;font-weight:800}
.sg{font-size:2.3rem;letter-spacing:6px}
.door{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#b9772f 0 16px,#a2652a 16px 19px);border:4px solid #7a4a1a;transition:transform 2.4s ease-in-out}
.door.l{left:0;transform-origin:left}.door.r{right:0;transform-origin:right}
.open .l{transform:rotateY(-110deg)}.open .r{transform:rotateY(110deg)}
.cf{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}.cf span{position:absolute;top:-40px;font-size:26px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.verse.sm{font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:1.9}.lg{grid-template-columns:1fr!important}.lg .opt{font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.8}
.how p{background:var(--card);border-radius:14px;padding:8px 14px;margin:8px auto;max-width:540px;text-align:right}
.nm{font:inherit;font-size:1.5rem;text-align:center;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:var(--opt);color:var(--ink);width:min(90%,360px)}
.bf{opacity:0;animation:bf 3s ease-in-out both}@keyframes bf{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0;transform:translate(60px,-120px) rotate(15deg)}}
.badge{display:none;margin:14px auto;max-width:460px;padding:20px;border-radius:24px;background:linear-gradient(135deg,#fff3b0,#ffd36b);color:#5a3a00;border:5px solid #d99a1d;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.badge.on{display:block;animation:pop .9s both}.badge b{font-size:3.4rem}.badge h3{margin:.2em 0;font-size:1.6rem}.badge p{margin:.2em}.nmv{font-size:2.1rem;font-weight:800;color:#8a3b00}
.rev #gi{animation:rev 2.4s ease-out both}@keyframes rev{from{transform:scale(1.5);filter:brightness(1.5) saturate(1.5)}}
.glow.gold{background:radial-gradient(circle at 50% 35%,rgba(255,230,120,.5),transparent 65%)}
.jr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.th{aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}.th.lk img{filter:grayscale(1) blur(4px) brightness(.8)}
.opt.card.cp{display:inline-block;width:auto;min-width:96px;margin:4px;font-size:1.5rem;min-height:56px}
.opts>:last-child:nth-child(odd){grid-column:1/-1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<div>
<main class="wrap" id="app"></main>
<noscript><p style="text-align:center">يرجى تفعيل JavaScript لتشغيل اللعبة.</p></noscript>

<!-- ===== Screen templates (script.js fills the {{placeholders}}) ===== -->

<!-- Home icon shown on every screen except Welcome and Questions -->
<template id="t-hb">
  <div><button class="hb" onclick="go('w')" aria-label="الصفحة الرئيسية">🏠</button></div>
</template>

<!-- Screen 1: Welcome -->
<template id="t-w">
  <div class="c">
    <h1>الحديقة المزدهرة</h1>
    <p class="sub">مراجعة سورة التحريم</p>
    {{garden}}
    <button class="btn" onclick="go('i')">ابدأ الرحلة</button>
  </div>
</template>

<!-- Game introduction + student name -->
<template id="t-i">
  <div class="c">
    <h2>كيف تلعب؟</h2>
    <div class="how">
      <p>🌱 خمسة مستويات لمراجعة سورة التحريم آية بعد آية</p>
      <p>✅ أجب عن الأسئلة لتنمو حديقتك</p>
      <p>🌸 كلما كانت إجاباتك أدق، ازدادت حديقتك جمالًا</p>
      <p>🔒 عليك اجتياز المستوى للانتقال إلى المستوى الذي بعده</p>
    </div>
    <label for="nm" class="ins">اكتب اسمك</label><br>
    <input id="nm" class="nm" maxlength="30" value="{{name}}" placeholder="اسمك هنا" autocomplete="off"><br>
    <button class="btn" onclick="gn()">هيا نبدأ</button>
  </div>
</template>

<!-- Screen 2: Level selection -->
<template id="t-s">
  <div class="c">
    <h2>اختر مستواك</h2>
    {{garden}}
    <div class="jr">{{journey}}</div>
    <div class="lvs">{{levels}}</div>
    <button class="ghost" onclick="rs()">{{reset}}</button>
    <button class="ghost" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">{{sound}}</button>
  </div>
</template>

<!-- Screen 3: Question screen -->
<template id="t-q">
  <div class="top">
    <span>
      <button class="hb" onclick="go('w')" aria-label="الصفحة الرئيسية">🏠</button>
      <button class="ghost" onclick="go('s')">المراحل</button>
    </span>
    <b>{{level}}</b>
    <span>{{prev}}{{pos}}</span>
  </div>
  <div class="bar"><i style="width:{{pct}}%"></i></div>
  <div class="play">
    <div id="qa">{{body}}</div>
    {{garden}}
  </div>
</template>

<!-- Level not passed: repeat the level -->
<template id="t-x">
  <div class="c">
    <h2>قريب جدًا!</h2>
    {{garden}}
    <p class="fb a">حديقتك تحتاج مزيدًا من المراجعة. راجع الآيات ثم أعد المستوى لتفتح المستوى التالي.</p>
    <button class="btn" onclick="start({{lv}})">أعد المستوى</button>
    <button class="ghost" onclick="go('s')">المراحل</button>
  </div>
</template>

<!-- Screen 4: Level completion -->
<template id="t-d">
  <div class="c">
    <h2>أحسنت! أنهيت {{level}}</h2>
    <p class="fb g" style="margin:0">انظر كيف ازدهرت حديقتك!</p>
    {{garden}}
    <p class="fb g">{{msg}}</p>
    <p>{{msg2}}</p>
    <p style="font-size:1.8rem;margin:0">{{petals}}</p>
    <button class="btn" onclick="{{next}}">تابع نمو حديقتك</button>
  </div>
</template>

<!-- Screen 5: Final celebration, secret gate and badge -->
<template id="t-f">
  <div class="cf">{{confetti}}</div>
  <div class="c">
    <h1 style="font-size:clamp(1.8rem,5vw,3rem)">أحسنت! لقد أصبحت حديقتك مزدهرة!</h1>
    {{garden}}
    <div class="gate" id="gate">
      <div class="secret">
        <div class="sg">🌺🪻🌷🌼🌸</div>
        <div>حديقتك السرية</div>
        <small>تفتحت لأنك واصلت المراجعة</small>
      </div>
      <div class="door l"></div>
      <div class="door r"></div>
    </div>
    <button class="btn" id="gb" onclick="op()">افتح البوابة السرية</button>
    <div class="badge" id="bd">
      <b>🏅</b>
      <h3>شارة إتقان سورة التحريم</h3>
      <p>تُمنح هذه الشارة إلى</p>
      <div class="nmv">{{name}}</div>
      <p>بارك الله فيك على مراجعتك وازدهار حديقتك</p>
    </div>
    <button class="ghost" onclick="go('s')">العودة للمراحل</button>
  </div>
</template>


</div>

const V=["", "يا أيها النبي لم تحرم ما أحل الله لك تبتغي مرضات أزواجك والله غفور رحيم", "قد فرض الله لكم تحلة أيمانكم والله مولاكم وهو العليم الحكيم", "وإذ أسر النبي إلى بعض أزواجه حديثا فلما نبأت به وأظهره الله عليه عرف بعضه وأعرض عن بعض فلما نبأها به قالت من أنبأك هذا قال نبأني العليم الخبير", "إن تتوبا إلى الله فقد صغت قلوبكما وإن تظاهرا عليه فإن الله هو مولاه وجبريل وصالح المؤمنين والملائكة بعد ذلك ظهير", "عسى ربه إن طلقكن أن يبدله أزواجا خيرا منكن مسلمات مؤمنات قانتات تائبات عابدات سائحات ثيبات وأبكارا", "يا أيها الذين آمنوا قوا أنفسكم وأهليكم نارا وقودها الناس والحجارة عليها ملائكة غلاظ شداد لا يعصون الله ما أمرهم ويفعلون ما يؤمرون", "يا أيها الذين كفروا لا تعتذروا اليوم إنما تجزون ما كنتم تعملون", "يا أيها الذين آمنوا توبوا إلى الله توبة نصوحا عسى ربكم أن يكفر عنكم سيئاتكم ويدخلكم جنات تجري من تحتها الأنهار يوم لا يخزي الله النبي والذين آمنوا معه نورهم يسعى بين أيديهم وبأيمانهم يقولون ربنا أتمم لنا نورنا واغفر لنا إنك على كل شيء قدير", "يا أيها النبي جاهد الكفار والمنافقين واغلظ عليهم ومأواهم جهنم وبئس المصير", "ضرب الله مثلا للذين كفروا امرأة نوح وامرأة لوط كانتا تحت عبدين من عبادنا صالحين فخانتاهما فلم يغنيا عنهما من الله شيئا وقيل ادخلا النار مع الداخلين", "وضرب الله مثلا للذين آمنوا امرأة فرعون إذ قالت رب ابن لي عندك بيتا في الجنة ونجني من فرعون وعمله ونجني من القوم الظالمين", "ومريم ابنت عمران التي أحصنت فرجها فنفخنا فيه من روحنا وصدقت بكلمات ربها وكتبه وكانت من القانتين"];

const pkey=()=>'bg66p:'+S.name.trim().toLowerCase();
const save=()=>{try{localStorage.setItem('bg66n',S.name);localStorage.setItem(pkey(),JSON.stringify({done:S.done,acc:S.acc}))}catch(e){}};
const load=()=>{S.done=[0,0,0,0,0];S.acc=[null,null,null,null,null];try{const x=JSON.parse(localStorage.getItem(pkey()));if(x&&x.done&&x.acc){S.done=x.done.map((d,i)=>x.done.slice(0,i+1).every(Boolean)?1:0);S.acc=x.acc}}catch(e){}};
const cnt=()=>S.done.filter(Boolean).length,stage=()=>Math.min(cnt(),4);
let AC,mute=0;
function tone(f,d,t,v=.07){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const sfx=k=>({g:[659,880],s:[330,294],w:[523,659,784,1047],b:[1047,1319,1568,1319,1760]}[k]).forEach((f,i)=>tone(f,k=='b'?.25:.35,i*(k=='b'?.12:.14),k=='b'?.03:.07));
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function deco(nl){let o='';S.acc.forEach((a,i)=>{if(a==null)return;let r=(i+1)*7919;const R=()=>(r=r*16807%2147483647)/2147483647,t=a>=.9?3:a>=.6?2:1,p=i===nl?' pop':'',F=['🌸','🌼','🌷','🌺'];
for(let k=0;k<(t==1?2:t==2?4:6);k++)o+=`<span class="${p}" style="left:${4+R()*88}%;top:${60+R()*30}%">${F[R()*4|0]}</span>`;if(t==3)o+='<i class="glow"></i>'});return o}
function flutter(){sfx('b');const d=$('.deco');if(!d)return;let h='';for(let i=0;i<7;i++)h+=`<span class="bf" style="left:${8+i*12}%;top:${50+(i%3)*14}%;animation-delay:${i*.25}s">🦋</span>`;d.insertAdjacentHTML('beforeend',h);setTimeout(()=>document.querySelectorAll('.bf').forEach(e=>e.remove()),5000)}
function garden(i,prev,nl,bl){const nx=Math.min(i+1,4);return `<div class="garden${prev!=null?' rev':''}">${prev!=null?`<img src="${G[prev]}" alt="">`:''}<img id="gi" src="${G[i]}" alt="حديقتك" ${prev!=null?'style="opacity:0"':''}>${bl!=null&&nx!=i?`<img id="nx" src="${G[nx]}" alt="" style="opacity:${bl}">`:''}<div class="deco">${deco(nl)}</div>${cnt()==5?'<i class="glow gold"></i>':''}</div>`}
function newQ(){const q=L[S.lv].q[S.qi],k=q[0];S.lock=0;
if(k=='a'){const cards=q[1].map(i=>V[i]);let p=cards.map((_,i)=>i);while(p.every((x,i)=>x==i))p=sh(p);S.c={k:'a',cards,pool:p,pick:[],v:'تبدأ هذه الآيات بـ: '+V[q[1][0]].split(' ').slice(0,5).join(' ')+' …'}}
else if(k=='n')S.c={k:'o',ins:'ما الآية التي تأتي بعد هذه الآية؟',v:V[q[1]],ans:V[q[1]+1],o:sh([V[q[1]+1],...sh(q[2]).slice(0,2).map(i=>V[i])]),long:1};
else if(k=='b')S.c={k:'o',ins:'اختر الجملة الناقصة من الآية',v:V[q[1]].replace(q[2],'_____'),ans:q[2],o:sh([q[2],...sh(q.slice(3)).slice(0,2)]),long:1};
else if(k=='w'){const cards=q[2];let p=cards.map((_,i)=>i);while(p.every((x,i)=>x==i))p=sh(p);const vv=V.find(v=>cards.every(c=>v.includes(c))),ix=Math.min(...cards.map(c=>vv.indexOf(c)));S.c={k:'a',ins:q[1],cards,pool:p,pick:[],cp:cards.every(x=>x.length<14),v:'بداية الآية: '+(ix>0?vv.slice(0,ix).trim():vv.split(' ').slice(0,6).join(' '))+' …'}}
else if(k=='s')S.c={k:'o',ins:'أكمل الآية بالجملة التالية',v:SEG.slice(0,q[1]).join(' ')+' …',ans:SEG[q[1]],o:sh([SEG[q[1]],...sh(q[2]).slice(0,2).map(x=>typeof x=='number'?SEG[x]:x)]),long:1};
else{const c=k=='c';S.c={k:'o',ins:c?'أكمل الآية':q[1],v:c?q[1]+' …':q[2],ans:c?q[2]:q[3],o:(()=>{const a=c?q.slice(2):q.slice(3);return sh([a[0],...sh(a.slice(1)).slice(0,2)])})()};S.c.long=S.c.o.some(x=>x.length>30)}}
function go(s){S.scr=s;S.sure=0;render()}
function start(i){if(!unl(i))return;S.lv=i;S.qi=0;S.ok=0;S.res=[];newQ();go('q')}
function pv(){if(S.qi>0){S.qi--;newQ();render()}}
const T=(id,m={})=>$('#t-'+id).innerHTML.replace(/\{\{(\w+)\}\}/g,(_,k)=>m[k]==null?'':m[k]);
const scr={
w:()=>T('w',{garden:garden(0)}),
i:()=>T('i',{name:esc(S.name)}),
x:()=>T('x',{garden:garden(stage()),lv:S.lv}),
s:()=>T('s',{garden:garden(stage()),
 journey:G.map((g,i)=>`<div class="th${i<=stage()?'':' lk'}"><img src="${g}" alt=""></div>`).join(''),
 levels:L.map((l,i)=>{const lock=!unl(i),a=S.acc[i];return `<button class="lv ${S.done[i]?'d':''}" ${lock?'disabled':''} onclick="start(${i})"><b>${lock?'🔒':i+1}</b>${l.n}<br><small>${l.r}</small><br>${lock?'<small>🔒 مغلق حتى تجتاز المستوى السابق</small>':a==null?'&nbsp;':'🌸'.repeat(a>=.9?3:a>=.6?2:1)}</button>`}).join(''),
 reset:S.sure?'اضغط مرة أخرى للتأكيد':'ابدأ من جديد',sound:mute?'🔇':'🔊'}),
q:()=>{const l=L[S.lv],n=l.q.length,c=S.c;let b;
if(c.k=='a')b=arr();else b=`<div class="ins">${c.ins}</div>${c.v?`<div class="verse${c.v.length>90?' sm':''}">${c.v}</div>`:''}<div class="opts${c.long?' lg':''}">${c.o.map((t,i)=>`<button class="opt" onclick="ans(${i})">${t}</button>`).join('')}</div><div id="fb"></div>`;
return T('q',{level:l.n,prev:S.qi>0?'<button class="ghost" onclick="pv()">السؤال السابق</button> ':'',pos:(S.qi+1)+' / '+n,pct:S.qi/n*100,body:b,garden:garden(stage(),null,-1,S.ok/n)})},
d:()=>{const l=L[S.lv],n=l.q.length,a=S.ok/n;
return T('d',{level:l.n,garden:garden(stage(),S.prev,S.lv),
 msg:a>=.9?'ما شاء الله! حديقتك تلمع بالجمال!':a>=.6?'أحسنت! أزهارك بدأت تتفتح.':'حديقتك بدأت تزدهر! راجع الآيات أكثر لتجعلها أجمل.',
 msg2:S.lv==3?'اقتربت حديقتك من الاكتمال!':a<.6?'بمزيد من المراجعة ستصبح حديقتك أجمل.':'',
 petals:'🌸'.repeat(S.ok),next:cnt()==5&&S.lv==4?"go('f')":"go('s')"})},
f:()=>T('f',{garden:garden(4),name:esc(S.name),
 confetti:Array.from({length:28},(_,i)=>`<span style="left:${(i*37)%100}%;animation-duration:${3+i%5}s;animation-delay:-${i%7}s">${['🌸','🌼','🌷','🌺'][i%4]}</span>`).join('')})};
function arr(){const c=S.c,all=c.pick.length==c.cards.length;
return `<div class="ins">${c.ins||'رتب الآيات كما وردت في السورة'}</div>${c.v?`<div class="verse sm">${c.v}</div>`:''}<div>${c.pick.map((p,j)=>`<button class="opt card${c.cp?' cp':''} ${c.done?'ok':''}" ${c.done?'disabled':''} onclick="un(${j})"><small>${j+1}</small>${c.cards[p]}</button>`).join('')||'<div class="hint">اضغط على الآيات بالترتيب الصحيح</div>'}</div><div>${c.done?'':c.pool.filter(p=>!c.pick.includes(p)).map(p=>`<button class="opt card${c.cp?' cp':''}" onclick="pk(${p})">${c.cards[p]}</button>`).join('')}</div><div id="fb">${all&&!c.done?'<button class="btn" onclick="chk()">تحقق</button>':''}</div>`}
const redo=()=>{$('#qa').innerHTML=arr()};
function pk(p){S.c.pick.push(p);redo()}function un(j){S.c.pick.splice(j,1);redo()}
function chk(){const c=S.c,ok=c.pick.every((p,j)=>p==j);c.done=1;c.pick=c.cards.map((_,i)=>i);S.res[S.qi]=ok;S.ok=S.res.filter(Boolean).length;redo();fb(ok)}
function ans(i){if(S.lock)return;S.lock=1;const c=S.c,ok=c.o[i]===c.ans;S.res[S.qi]=ok;S.ok=S.res.filter(Boolean).length;
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(c.o[j]===c.ans)b.classList.add('ok');else if(j===i)b.classList.add('no')});fb(ok)}
function fb(ok){sfx(ok?'g':'s');const e=$('#nx');if(e)e.style.opacity=S.ok/L[S.lv].q.length;const last=S.qi+1==L[S.lv].q.length;$('#fb').innerHTML=`<div class="fb ${ok?'g':'a'}">${ok?'✓ أحسنت!':'🌱 قريب! الإجابة الصحيحة بالأخضر'}</div><button class="btn" onclick="nx()">${last?'أنهِ المستوى':'التالي'}</button>`}
function nx(){if(S.qi+1<L[S.lv].q.length){S.qi++;newQ();render();return}
if(L[S.lv].q.length-S.ok>3){sfx('s');go('x');return}S.prev=stage();S.done[S.lv]=1;S.acc[S.lv]=Math.max(S.acc[S.lv]||0,S.ok/L[S.lv].q.length);save();sfx('w');go('d')}
function gn(){const v=$('#nm').value.trim();if(!v){$('#nm').placeholder='اكتب اسمك أولًا';$('#nm').focus();return}S.name=v;load();save();go('s')}
function op(){$('#gate').classList.add('open');$('#gb').style.display='none';sfx('w');setTimeout(()=>{$('#bd').classList.add('on');sfx('w')},2300)}
function rs(){if(!S.sure){S.sure=1;render();return}S.sure=0;S.done=[0,0,0,0,0];S.acc=[null,null,null,null,null];save();go('w')}
function render(){if(S.scr=='q'&&!unl(S.lv))S.scr='s';$('#app').innerHTML=(['w','q'].includes(S.scr)?'':T('hb'))+scr[S.scr]();scrollTo(0,0);if(S.scr=='d'){setTimeout(()=>{const g=$('#gi');g&&(g.style.opacity=1)},300);flutter()}}
render();

</script>
</body>
</html>
